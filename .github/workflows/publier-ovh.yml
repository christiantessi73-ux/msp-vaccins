# Publie le site sur l'hébergement OVH à chaque commit sur main.
#
# OVH mutualisé se met à jour par transfert de fichiers, pas en git push :
# cette action fait la traduction, pour qu'un commit reste le seul geste de
# mise en ligne.
#
# En SFTP, pas en FTPS : le serveur d'OVH répond « 500 This security scheme
# is not implemented » à une tentative de FTPS, mais son port 22 répond en
# OpenSSH. Le FTP simple aurait marché, au prix du mot de passe en clair sur
# le réseau - ce qui ne se justifie pas quand SFTP est disponible.
#
# Trois secrets à créer dans GitHub (Settings → Secrets and variables →
# Actions). Ils ne doivent jamais apparaître ailleurs que là :
#   OVH_FTP_HOST      ftp.cluster129.hosting.ovh.net
#   OVH_FTP_USER      l'identifiant FTP (espace client OVH → FTP-SSH)
#   OVH_FTP_PASSWORD  le mot de passe associé
#
# La liste d'exclusions est le vrai intérêt du procédé : le dépôt garde
# tout, le serveur public ne reçoit que le site. Le script Apps Script, la
# notice des statistiques et l'affiche cessent d'être téléchargeables par
# n'importe qui, sans avoir à réorganiser le dépôt.

name: Publier sur OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Le journal de cette étape est la façon la plus simple de voir ce qui
      # est réellement en ligne, sans installer de client FTP : GitHub →
      # Actions → dernière exécution → « Lister les fichiers publiés ».
      - name: Lister les fichiers publiés
        env:
          HOTE: ${{ secrets.OVH_FTP_HOST }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
          MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          lftp -c "set sftp:auto-confirm yes; \
                   open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" sftp://$HOTE; \
                   pwd; echo '--- racine du compte ---'; cls -l;                    echo '--- contenu publie (www) ---'; find www/"

      - name: Envoyer les fichiers du site
        env:
          HOTE: ${{ secrets.OVH_FTP_HOST }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
          MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          lftp -c "set sftp:auto-confirm yes; \
                   set net:max-retries 3; \
                   set net:timeout 20; \
                   open -u \"$UTILISATEUR\",\"$MOTDEPASSE\" sftp://$HOTE; \
                   mirror --reverse --delete --verbose --no-perms \
                     --exclude-glob .well-known/ \
                     --exclude-glob cgi-bin/ \
                     --exclude-glob .ovhconfig \
                     --exclude-glob .git* \
                     --exclude-glob .github/ \
                     --exclude-glob apps-script/ \
                     --exclude-glob dist/ \
                     --exclude-glob STATISTIQUES.md \
                     --exclude-glob affiche-msp-vaccins.* \
                     --exclude-glob qr-msp-vaccins.png \
                     --exclude-glob affiche-saisie.html \
                     --exclude-glob affiche-indicateurs.html \
                     --exclude-glob qr-saisie.svg \
                     --exclude-glob qr-indicateurs.svg \
                     --exclude-glob CNAME \
                     --exclude-glob _headers \
                     --exclude-glob *.pdf \
                     --exclude-glob *.jpg \
                     ./ www/"
